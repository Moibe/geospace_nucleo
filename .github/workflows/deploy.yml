name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            source ~/.bashrc || true
            source ~/.nvm/nvm.sh || true

            cd ${{ secrets.WORK_DIR }}

            # Traer cambios
            git pull origin ${{ secrets.MAIN_BRANCH }}

            # Crear venv si no existe
            if [ ! -d "venv" ]; then
              python3 -m venv venv
            fi

            # Instalar dependencias
            venv/bin/pip install -r requirements.txt --quiet

            # Crear carpeta de logs si no existe
            mkdir -p logs

            # Reiniciar (o iniciar) con PM2
            pm2 describe geospace-nucleo > /dev/null 2>&1 && \
              pm2 restart geospace-nucleo || \
              pm2 start venv/bin/uvicorn --name geospace-nucleo --interpreter none -- api.app:app --host 0.0.0.0 --port 8001

            pm2 save
